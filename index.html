<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A web-based DAISY 3 standard compatible e-book reader with text-to-speech and offline support."
    />

    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link
      as="style"
      rel="stylesheet preload prefetch"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
    />

    <title>Daisy Web - E-book Reader</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%BASE_URL%assets/favicon-16x16.png"
    />
    <link
      rel="mask-icon"
      href="%BASE_URL%assets/safari-pinned-tab.svg"
      color="#3c40c6"
    />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <meta name="apple-mobile-web-app-title" content="Daisy Web" />
    <meta name="application-name" content="Daisy Web" />
    <meta name="msapplication-TileColor" content="#2d89ef" />
    <meta
      name="msapplication-config"
      content="%BASE_URL%assets/browserconfig.xml"
    />
    <meta name="theme-color" content="#ffffff" />

    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
  </head>

  <body>
    <div id="app"></div>
    <noscript>
      <p>Oops! Javascript required here! Allow it and try again!</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
